name: test
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python3 -m unittest discover -s guards/tests -v
      - name: install into an empty project
        run: |
          d=$(mktemp -d) && git -C "$d" init -q && ./install.sh "$d"
          test -f "$d/tools/archguard/archguard.py" && test -f "$d/.claude/skills/architecture-guard/SKILL.md"
          test -f "$d/tools/testguard/testguard.py" && test -f "$d/.claude/skills/test-guard/SKILL.md"
