; import-linter contracts (pip install import-linter; lint-imports). Layout: app/<domain>/{web,application,domain,persistence}
[importlinter]
root_package = app

[importlinter:contract:layers]
name = Layers point downwards
type = layers
containers =
    app.orders
    app.billing
layers =
    web
    application
    domain
; persistence sits beside domain: application -> persistence is allowed, domain -> persistence is not
[importlinter:contract:domain-pure]
name = Domain layer imports no frameworks or data access
type = forbidden
source_modules =
    app.orders.domain
    app.billing.domain
forbidden_modules =
    sqlalchemy
    fastapi
    django
    app.orders.persistence
    app.billing.persistence

[importlinter:contract:independent-domains]
name = Domains do not import each other's persistence
type = forbidden
source_modules = app.orders
forbidden_modules = app.billing.persistence
